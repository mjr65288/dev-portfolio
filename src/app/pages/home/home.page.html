@if (data$ | async; as data) {
  <!-- Full-Viewport Hero Section -->
  <section class="hero-section">
    <div class="hero-container">
      <div class="hero-content-centered">
        <h1 class="hero-title-large">
          Hi, I'm <span class="hero-name-highlight">{{ data.name }}</span>
        </h1>
        <p class="hero-tagline">
          {{ data.home?.tagline || 'Software Engineer passionate about building exceptional web experiences.' }}
        </p>
        <!-- <div class="hero-actions">
          <a routerLink="/projects" class="hero-cta-btn">
            View My Projects
          </a>
        </div> -->
        <!-- Social Links (Icon Only) -->
        <div class="hero-socials-minimal">
          @for (s of data.socials; track s.url) {
            <a class="social-icon-link" [href]="s.url" target="_blank" rel="noopener" [attr.aria-label]="s.label">
              <i class="pi" [ngClass]="s.icon"></i>
            </a>
          }
        </div>
      </div>
      <!-- <div class="scroll-indicator" (click)="scrollToContent()">
        <span>Scroll</span>
        <i class="pi pi-chevron-down"></i>
      </div> -->

          Have a project in mind or want to collaborate? I'd love to hear from you.
        </p>
        <div class="flex gap-2 justify-content-center flex-wrap">
          <a routerLink="/contact" class="view-all-btn">

          </a>
