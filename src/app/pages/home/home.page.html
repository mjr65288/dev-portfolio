@if (data$ | async; as data) {
  <div class="container pt-8">
    <header class="hero-header flex align-items-center justify-content-between mb-4 flex-column md:flex-row gap-3">
      <div>
        <h1 style="margin:0">Hi, I'm {{ data.name }}</h1>
        <p class="section-sub" style="margin:.5rem 0 0 0">
          <span class="rotating-text" [attr.data-index]="currentPhraseIndex">{{ currentPhrase }}</span> ✦ {{ data.location }}
        </p>
      </div>
      <div class="flex gap-3 align-items-center">
        @for (s of data.socials; track s.url) {
        <a class="link" [href]="s.url" target="_blank" rel="noopener">
          <i class="pi" [ngClass]="s.icon"></i>
          <span class="ml-2">{{ s.label }}</span>
        </a>
        }
      </div>
    </header>


    <app-section-header title="Featured Projects" subtitle="A few things I've built recently"></app-section-header>


    <div class="grid" style="gap:1.25rem; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));">
      @for (p of data.projects | slice:0:6; track p.title) {
      <app-project-card [project]="p" />
      }
    </div>

    <div class="flex justify-content-center mt-5 mb-4">
      <a routerLink="/projects" class="view-all-btn">
        View All Projects
      </a>
    </div>

    <div class="contact-cta text-center mt-6 mb-4">
      <h2 style="margin:0 0 1rem 0; font-size: 1.75rem;">Let's build something together</h2>
      <a routerLink="/contact" class="link" style="font-size: 1.1rem;">Get in touch →</a>
    </div>
  </div>
  }
