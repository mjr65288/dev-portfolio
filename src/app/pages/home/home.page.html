@if (data$ | async; as data) {
  <div class="container">
    <header class="flex align-items-center justify-content-between mb-4">
      <div>
        <h1 style="margin:0">Hi, I'm {{ data.name }}</h1>
        <p class="section-sub" style="margin:.5rem 0 0 0">{{ data.role }} · {{ data.location }}
        </p>
      </div>
      <div class="flex gap-3">
        @for (s of data.socials; track s.url) {
        <a class="link" [href]="s.url" target="_blank" rel="noopener">
          <i class="pi" [ngClass]="s.icon"></i>
          <span class="ml-2">{{ s.label }}</span>
        </a>
        }
      </div>
    </header>


    <app-section-header title="Featured Projects" subtitle="A few things I've built recently"></app-section-header>


    <div class="grid" style="gap:1.25rem; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));">
      @for (p of data.projects | slice:0:6; track p.title) {
      <app-project-card [project]="p" />
      }
    </div>
  </div>
  }
