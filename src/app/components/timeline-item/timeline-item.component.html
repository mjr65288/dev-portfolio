<div class="flex gap-3">
  <div style="width:10px; background: var(--brand); border-radius: 8px;"></div>
  <div>
    <h3 style="margin:0 0 .25rem 0">{{ role }} — {{ company }}</h3>
    <small style="color:var(--muted)">{{ start }} – {{ end || 'Present' }}</small>
    <ul class="mt-2">
      @for (b of bullets; track $index) {
      <li style="margin-bottom:.25rem;">{{ b }}</li>
      }
    </ul>
  </div>
</div>
